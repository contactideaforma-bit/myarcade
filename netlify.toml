# Configuration Netlify — site statique, aucun build nécessaire
[build]
  publish = "."
  command = ""

# --- Anti « ancienne version » : on force le navigateur à revérifier ---
# no-cache = le navigateur peut garder le fichier mais DOIT revalider auprès
# du serveur à chaque chargement (304 si inchangé). On voit donc toujours la
# dernière version dès qu'un déploiement est publié.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

# --- Sécurité de base ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
